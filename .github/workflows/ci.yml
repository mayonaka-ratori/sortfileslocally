name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements-cpu.txt || true
          pip install pytest pytest-cov uvicorn
      
      - name: Install Node dependencies
        run: cd web && npm ci
      
      - name: Python Lint
        run: echo "Python lint placeholder"
      
      - name: ESLint
        run: cd web && npm run lint
      
      - name: Backend Tests with Coverage
        run: python -m pytest tests/ -v --tb=short -x --cov=src --cov=server --cov-report=term-missing
        env:
          SKIP_GPU_TESTS: "1"
      
      - name: Coverage Summary
        if: always()
        run: python -m pytest tests/ --cov=src --cov=server --cov-report=json --quiet || true
      
      - name: Frontend Build
        run: cd web && npm run build
      
      - name: Privacy Audit
        run: python scripts/privacy_audit.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        run: |
          pip install -r requirements-cpu.txt || true
          pip install pytest uvicorn
          cd web && npm ci
          npx playwright install chromium --with-deps
      
      - name: Start Servers and Run E2E Tests
        run: |
          # Start Backend
          python -m uvicorn server.main:app --host 0.0.0.0 --port 8000 &
          
          # Start Frontend
          cd web && npm run dev &
          
          # Wait for both to be ready
          echo "Waiting for servers to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:8000/health > /dev/null && curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          
          # Run tests
          cd web && npx playwright test --reporter=github
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Skip heavy models in E2E unless specifically needed
          SKIP_GPU_TESTS: "1"
      
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

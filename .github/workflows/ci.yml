name: Sprint 6 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install pytest pytest-asyncio uvicorn
          
      - name: Run Backend Tests
        run: |
          python -m pytest tests/ -v -m "not gpu and not ai_models and not slow" --tb=short
        env:
          CI: "true"

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          
      - name: Install dependencies
        run: cd web && npm ci
        
      - name: Type Check
        run: cd web && npx tsc --noEmit
        
      - name: Lint
        run: cd web && npm run lint

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          
      - name: Install Linux Dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Cargo Check
        run: cd src-tauri && cargo check

  type-gen-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          
      - name: Install dependencies
        run: |
          pip install -r requirements-cpu.txt
          pip install uvicorn
          cd web && npm ci
          
      - name: Generate Types and Verify
        run: |
          # Start backend in background
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8765 &
          BACKEND_PID=$!
          
          # Wait for ready
          echo "Waiting for backend..."
          timeout 30s bash -c "until curl -s http://localhost:8765/openapi.json > /dev/null; do sleep 1; done"
          
          # Generate
          mkdir -p web/src/generated
          npx openapi-typescript http://localhost:8765/openapi.json -o web/src/generated/api-types-ci.ts
          
          # Stop backend
          kill $BACKEND_PID
          
          # Diff
          if ! diff web/src/generated/api-types.ts web/src/generated/api-types-ci.ts; then
            echo "❌ ERROR: Generated types differ from committed api-types.ts. Run 'npm run generate-types' and commit changes."
            exit 1
          fi
          echo "✅ Types are up-to-date."
